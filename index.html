<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
--bg-dark: #07050a;
--card-bg: rgba(20, 15, 35, 0.6);
--accent-purple: #b57cff;
--accent-pink: #ff7ce5;
--text-main: #ffffff;
--text-muted: #a39bb0;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
body {
background-color: var(--bg-dark);
background-image: radial-gradient(circle at 15% 50%, rgba(100, 50, 200, 0.15), transparent 40%),
radial-gradient(circle at 85% 30%, rgba(200, 50, 150, 0.1), transparent 40%);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
color: var(--text-main);
position: relative;
}
body::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
background-size: 550px 550px, 350px 350px, 250px 250px;
background-position: 0 0, 40px 60px, 130px 270px;
opacity: 0.3;
animation: bgStars 60s linear infinite;
z-index: 0;
}
@keyframes bgStars {
from { background-position: 0 0, 40px 60px, 130px 270px; }
to { background-position: 550px 550px, 390px 410px, 380px 520px; }
}
.profile-card {
position: relative;
width: 100%;
max-width: 380px;
height: 680px;
background: var(--card-bg);
border-radius: 24px;
border: 1px solid rgba(255, 255, 255, 0.08);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
box-shadow: 0 0 40px rgba(100, 50, 200, 0.2), inset 0 0 20px rgba(180, 100, 255, 0.05);
overflow: hidden;
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
padding: 60px 24px 24px 24px;
z-index: 10;
animation: cardAppear 1s ease-out forwards;
}
@keyframes cardAppear {
from { opacity: 0; transform: translateY(30px) scale(0.95); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
.music-toggle {
position: absolute;
top: 20px;
right: 20px;
width: 42px;
height: 42px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.15);
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
transition: all 0.3s ease;
color: var(--text-main);
z-index: 30;
backdrop-filter: blur(10px);
}
.music-toggle:hover {
background: rgba(180, 100, 255, 0.25);
border-color: var(--accent-purple);
transform: scale(1.1);
box-shadow: 0 0 15px rgba(180, 100, 255, 0.5);
}
.music-toggle svg { width: 20px; height: 20px; fill: currentColor; transition: opacity 0.3s ease; }
.music-toggle .icon-off { display: block; }
.music-toggle .icon-on { display: none; }
.music-toggle.playing {
color: var(--accent-purple);
border-color: var(--accent-purple);
box-shadow: 0 0 15px rgba(180, 100, 255, 0.5);
}
.music-toggle.playing .icon-off { display: none; }
.music-toggle.playing .icon-on { display: block; }
.music-toggle.playing::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
border-radius: 50%;
border: 2px solid var(--accent-purple);
animation: pulse 1.5s ease-out infinite;
}
@keyframes pulse {
0% { transform: scale(1); opacity: 0.8; }
100% { transform: scale(1.6); opacity: 0; }
}
.avatar-container {
position: relative;
width: 96px;
height: 96px;
margin-bottom: 20px;
z-index: 20;
}
.avatar {
width: 100%;
height: 100%;
border-radius: 50%;
object-fit: cover;
border: 3px solid rgba(255, 255, 255, 0.1);
box-shadow: 0 0 20px rgba(180, 100, 255, 0.5);
position: relative;
z-index: 2;
}
.avatar-glow {
position: absolute;
top: -5px; left: -5px; right: -5px; bottom: -5px;
border-radius: 50%;
background: conic-gradient(from 0deg, var(--accent-purple), var(--accent-pink), var(--accent-purple));
animation: rotate 4s linear infinite;
z-index: 1;
filter: blur(8px);
opacity: 0.7;
}
@keyframes rotate { 100% { transform: rotate(360deg); } }
.nickname {
font-size: 28px;
font-weight: 800;
letter-spacing: 1px;
margin-bottom: 4px;
text-shadow: 0 0 10px rgba(255,255,255,0.3);
z-index: 20;
}
.real-name {
font-size: 14px;
color: var(--text-muted);
font-weight: 600;
margin-bottom: 24px;
z-index: 20;
}
.quote {
font-size: 14px;
line-height: 1.6;
color: #d1c9e0;
font-style: italic;
background: rgba(0, 0, 0, 0.25);
padding: 16px;
border-radius: 16px;
border: 1px solid rgba(180, 100, 255, 0.2);
box-shadow: 0 0 15px rgba(180, 100, 255, 0.1) inset;
margin-bottom: 30px;
z-index: 20;
position: relative;
animation: fadeIn 2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.social-links {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 12px;
max-width: 260px;
margin-bottom: auto;
z-index: 20;
position: relative;
}
.social-link {
width: 40px;
height: 40px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
display: flex;
justify-content: center;
align-items: center;
transition: all 0.3s ease;
color: var(--text-main);
text-decoration: none;
}
.social-link:hover {
background: rgba(180, 100, 255, 0.3);
border-color: var(--accent-purple);
transform: translateY(-3px) scale(1.1);
box-shadow: 0 5px 15px rgba(180, 100, 255, 0.5);
color: #fff;
}
.social-link svg { width: 18px; height: 18px; fill: currentColor; }
.tide-container {
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 5;
overflow: hidden;
animation: tideMove 6s ease-in-out infinite alternate;
}
@keyframes tideMove {
0% { transform: translateY(50px); }
100% { transform: translateY(0px); }
}
.wave-glow {
position: absolute;
bottom: -50px;
left: 0;
width: 100%;
height: 150px;
background: radial-gradient(ellipse at bottom, rgba(180, 100, 255, 0.8) 0%, transparent 70%);
filter: blur(20px);
z-index: 6;
}
.wave-svg {
position: absolute;
bottom: -10px;
left: 0;
width: 100%;
height: 150px;
z-index: 7;
}
.wave-svg svg { width: 100%; height: 100%; }
.particle {
position: absolute;
bottom: 20px;
background: #fff;
border-radius: 50%;
box-shadow: 0 0 10px #fff, 0 0 20px var(--accent-pink), 0 0 30px var(--accent-purple);
filter: blur(1px);
opacity: 0;
z-index: 8;
animation: floatUp linear infinite;
}
@keyframes floatUp {
0% { transform: translateY(0) scale(0.5); opacity: 0; }
20% { opacity: 1; transform: translateY(-40px) scale(1.2); }
80% { opacity: 0.8; }
100% { transform: translateY(-250px) scale(0.8); opacity: 0; }
}
@media (max-height: 750px) {
.profile-card { height: 90vh; padding: 40px 16px 16px 16px; }
.quote { font-size: 12px; padding: 12px; margin-bottom: 20px; }
.social-links { gap: 8px; max-width: 220px; }
.social-link { width: 36px; height: 36px; }
.social-link svg { width: 16px; height: 16px; }
.music-toggle { width: 36px; height: 36px; top: 16px; right: 16px; }
}
</style>

<script>
const particlesContainer = document.getElementById('particles-container');
const particleCount = 25;

for (let i = 0; i < particleCount; i++) {
const particle = document.createElement('div');
particle.classList.add('particle');
const leftPos = Math.random() * 80 + 10;
particle.style.left = `${leftPos}%`;
const size = Math.random() * 12 + 4;
particle.style.width = `${size}px`;
particle.style.height = `${size}px`;
const duration = Math.random() * 4 + 4;
particle.style.animationDuration = `${duration}s`;
const delay = Math.random() * 8;
particle.style.animationDelay = `${delay}s`;
particlesContainer.appendChild(particle);
}

const music = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');

music.volume = 0.4;

let userWantsMusic = true;

function setButtonPlaying() {
musicToggle.classList.add('playing');
musicToggle.title = "Выключить музыку";
}

function setButtonPaused() {
musicToggle.classList.remove('playing');
musicToggle.title = "Включить музыку";
}

function tryStartMusic() {
if (!userWantsMusic) return;
const promise = music.play();
if (promise !== undefined) {
promise.then(() => {
setButtonPlaying();
}).catch(() => {
setButtonPaused();
});
}
}

musicToggle.addEventListener('click', () => {
if (music.paused) {
userWantsMusic = true;
music.play().then(() => setButtonPlaying()).catch(() => setButtonPaused());
} else {
userWantsMusic = false;
music.pause();
setButtonPaused();
}
});

window.addEventListener('load', () => {
tryStartMusic();
});

['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(evt => {
document.addEventListener(evt, () => {
if (userWantsMusic && music.paused) {
tryStartMusic();
}
}, { passive: true });
});
</script>
